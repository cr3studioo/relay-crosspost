name: Publishing worker
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'tick imports/continues the queue; probe downloads only; verify publishes ONE chosen setup-test video'
        type: choice
        options: [tick, probe, verify]
        default: tick
      profile_url:
        description: 'Public TikTok profile URL (probe only)'
        type: string
      video_url:
        description: 'Optional exact TikTok video URL (probe only)'
        type: string
      video_id:
        description: 'Chosen imported TikTok ID (verify only; creates real posts within your posting hours)'
        type: string
permissions:
  contents: read
concurrency:
  group: relay-publisher
  cancel-in-progress: false
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      META_GRAPH_VERSION: v25.0
      TIKTOK_PROFILE_URL: ${{ secrets.TIKTOK_PROFILE_URL }}
      TIKTOK_CHANNEL_ID: ${{ secrets.TIKTOK_CHANNEL_ID }}
      RELAY_MODE: ${{ inputs.mode || 'tick' }}
      RELAY_PROFILE: ${{ inputs.profile_url }}
      RELAY_VIDEO_URL: ${{ inputs.video_url }}
      RELAY_VIDEO_ID: ${{ inputs.video_id }}
    steps:
      - name: Check configuration
        id: configuration
        run: |
          if [ "$RELAY_MODE" = "probe" ] || { [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -n "$TOKEN_ENCRYPTION_KEY" ]; }; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Setup pending: add the worker secrets. No accounts contacted.'
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.configuration.outputs.ready == 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.configuration.outputs.ready == 'true'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install worker dependencies
        if: steps.configuration.outputs.ready == 'true'
        run: pip install -r worker/requirements.txt
      - name: Install ffprobe
        if: steps.configuration.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run worker
        if: steps.configuration.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import os, subprocess, sys
          mode = os.environ['RELAY_MODE']
          args = [sys.executable, '-m', 'worker.main', mode]
          if mode == 'probe':
              args.extend(['--profile', os.environ['RELAY_PROFILE']])
              if os.environ.get('RELAY_VIDEO_URL'):
                  args.extend(['--video-url', os.environ['RELAY_VIDEO_URL']])
          elif not all(os.environ.get(k) for k in ('SUPABASE_URL', 'SUPABASE_SERVICE_ROLE_KEY', 'TOKEN_ENCRYPTION_KEY')):
              print('Setup pending: add the worker secrets. No accounts contacted.')
              sys.exit(0)
          elif mode == 'verify':
              args.extend(['--video-id', os.environ['RELAY_VIDEO_ID']])
          sys.exit(subprocess.call(args))
          PY
